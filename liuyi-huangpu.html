<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎆 六一儿童节</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #0a0a1a;
}

/* ===== 背景层 ===== */
.bg-layer {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 0;
  background: linear-gradient(to bottom,
    #050510 0%, #0a0a2e 20%, #0d1033 40%, #141840 60%, #1a2048 75%, #0d1526 90%, #0a0f20 100%
  );
}

/* 月亮 */
.moon {
  position: fixed;
  top: 5%; right: 12%;
  width: clamp(35px, 8vw, 60px);
  height: clamp(35px, 8vw, 60px);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #FFFDE7 0%, #FFE082 50%, #FFD54F 100%);
  box-shadow: 0 0 40px rgba(255,245,157,0.4), 0 0 80px rgba(255,235,59,0.2);
  z-index: 2;
}

/* 星星 */
.star {
  position: fixed;
  width: 2px; height: 2px;
  background: #fff;
  border-radius: 50%;
  z-index: 2;
  animation: twinkle 2s ease-in-out infinite alternate;
}

@keyframes twinkle { from { opacity: 0.3; } to { opacity: 1; } }

/* 建筑天际线 */
.skyline {
  position: fixed;
  bottom: 32%; left: 0; width: 100%; height: 120px;
  z-index: 3;
}

/* 江面 */
.river {
  position: fixed;
  bottom: 0; left: 0; width: 100%; height: 32%;
  z-index: 4;
  background: linear-gradient(to bottom, #080d1a 0%, #0a1020 50%, #0d1526 100%);
  opacity: 0.95;
}

.river::after {
  content: '';
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(90deg,
    transparent 0%, rgba(255,200,80,0.02) 15%, transparent 30%,
    rgba(255,220,120,0.03) 50%, transparent 65%,
    rgba(255,200,80,0.02) 85%, transparent 100%
  );
  animation: shimmer 5s ease-in-out infinite alternate;
}

@keyframes shimmer { from { opacity: 0.4; } to { opacity: 1; } }

/* ===== Canvas 烟花层 ===== */
#fwCanvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 50;
  pointer-events: none;
}

/* ===== 彩带/爱心/气球层 ===== */
.fx-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

.cf-piece {
  position: absolute;
  z-index: 61;
}
@keyframes cfFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(105vh) rotate(1080deg); opacity: 0; }
}

.ht-piece {
  position: absolute;
  z-index: 62;
  animation: htUp 3.5s ease-out forwards;
}
@keyframes htUp {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-400px) scale(0.3); opacity: 0; }
}

.bl-item {
  position: absolute;
  bottom: -100px;
  z-index: 63;
  animation: blUp 14s ease-in forwards;
}
@keyframes blUp {
  0% { transform: translateY(0) rotate(-4deg); opacity: 1; }
  100% { transform: translateY(-115vh) rotate(10deg); opacity: 0; }
}

/* ===== 主内容 ===== */
.main {
  position: relative;
  z-index: 100;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh;
  padding: 30px 20px;
}

.title {
  font-size: clamp(2.2rem, 8vw, 4rem);
  font-weight: 900;
  color: #FFD700;
  text-shadow:
    0 0 10px rgba(255,215,0,0.8),
    0 0 30px rgba(255,215,0,0.5),
    0 0 60px rgba(255,165,0,0.3);
  margin-bottom: 10px;
  animation: titlePulse 3s ease-in-out infinite;
  letter-spacing: 0.08em;
}

@keyframes titlePulse {
  0%, 100% { text-shadow: 0 0 10px rgba(255,215,0,0.8), 0 0 30px rgba(255,215,0,0.5); }
  50% { text-shadow: 0 0 25px rgba(255,215,0,1), 0 0 60px rgba(255,215,0,0.7), 0 0 100px rgba(255,165,0,0.4); }
}

.sub {
  font-size: clamp(1rem, 3vw, 1.4rem);
  color: rgba(255,255,255,0.85);
  text-shadow: 0 0 10px rgba(100,150,200,0.4);
  margin-bottom: 40px;
  font-weight: 600;
  letter-spacing: 0.2em;
}

/* 按钮 */
.btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

.btn {
  padding: 13px 26px;
  border: 2px solid rgba(255,215,0,0.6);
  border-radius: 16px;
  font-size: clamp(0.95rem, 2.8vw, 1.2rem);
  font-weight: 700;
  cursor: pointer;
  background: rgba(10,15,35,0.7);
  color: #FFD700;
  text-shadow: 0 0 8px rgba(255,215,0,0.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 0 15px rgba(255,215,0,0.2), inset 0 0 15px rgba(255,215,0,0.05);
  transition: all 0.25s ease;
  font-family: inherit;
  position: relative;
}

.btn:active { transform: scale(0.95); }

.btn.on {
  background: linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #FF8C00 100%) !important;
  border-color: #FFF !important;
  color: #000 !important;
  text-shadow: none !important;
  box-shadow: 0 0 30px rgba(255,215,0,0.8), 0 0 60px rgba(255,165,0,0.5) !important;
  transform: scale(1.08) !important;
  animation: btnGlow 1.5s ease-in-out infinite;
}

@keyframes btnGlow {
  0%, 100% { box-shadow: 0 0 30px rgba(255,215,0,0.8), 0 0 60px rgba(255,165,0,0.5); }
  50% { box-shadow: 0 0 50px rgba(255,215,0,1), 0 0 90px rgba(255,165,0,0.7); }
}

/* 音效激活弹窗 */
.sound-modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.sound-modal.hidden { display: none; }
.sound-modal h2 {
  color: #FFD700;
  font-size: 24px;
  margin-bottom: 20px;
  text-shadow: 0 0 20px rgba(255,215,0,0.5);
}
.sound-modal p {
  color: rgba(255,255,255,0.7);
  font-size: 14px;
  margin-bottom: 30px;
}
.sound-btn {
  padding: 15px 40px;
  font-size: 18px;
  font-weight: bold;
  border: 2px solid #FFD700;
  border-radius: 25px;
  background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
  color: #000;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.sound-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 30px rgba(255,215,0,0.6);
}

/* 音效状态指示 */
.sound-hint {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.6);
  color: #FFD700;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 12px;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.3s;
}
.sound-hint.show { opacity: 1; }

@media (max-width: 480px) {
  .btns { flex-direction: column; align-items: center; }
  .btn { width: 80%; max-width: 200px; }
}
</style>
</head>

<script>
// ========== 专业音效引擎 ==========
var audioCtx = null;
var masterGain = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.4;
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// 烟花发射音效 - 柔和的上升声（火箭上升感）
function playLaunchSound() {
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  
  // 白噪声源（嘶嘶声）
  var bufferSize = audioCtx.sampleRate * 0.8;
  var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  var data = buffer.getChannelData(0);
  for (var i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1);
  }
  var noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  
  // 滤波器 - 从低到高扫频（模拟上升）
  var filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.Q.value = 1;
  filter.frequency.setValueAtTime(200, t);
  filter.frequency.exponentialRampToValueAtTime(2000, t + 0.6);
  
  // 音量包络 - 渐强渐弱
  var gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.3, t + 0.1);
  gain.gain.exponentialRampToValueAtTime(0.01, t + 0.8);
  
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  
  noise.start(t);
  noise.stop(t + 0.8);
}

// 烟花爆炸音效 - 分层的爆炸声（嘭~）
function playExplosionSound() {
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  
  // 第一层：低频冲击（嘭）
  var osc1 = audioCtx.createOscillator();
  osc1.type = 'sine';
  osc1.frequency.setValueAtTime(80, t);
  osc1.frequency.exponentialRampToValueAtTime(30, t + 0.3);
  
  var gain1 = audioCtx.createGain();
  gain1.gain.setValueAtTime(0.5, t);
  gain1.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
  
  osc1.connect(gain1);
  gain1.connect(masterGain);
  
  // 第二层：中频爆裂
  var osc2 = audioCtx.createOscillator();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(200, t);
  osc2.frequency.exponentialRampToValueAtTime(80, t + 0.15);
  
  var gain2 = audioCtx.createGain();
  gain2.gain.setValueAtTime(0.25, t);
  gain2.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
  
  osc2.connect(gain2);
  gain2.connect(masterGain);
  
  // 第三层：高频爆点（啪）
  var bufferSize = audioCtx.sampleRate * 0.15;
  var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  var data = buffer.getChannelData(0);
  for (var i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.05));
  }
  var crack = audioCtx.createBufferSource();
  crack.buffer = buffer;
  
  var filter3 = audioCtx.createBiquadFilter();
  filter3.type = 'highpass';
  filter3.frequency.value = 800;
  
  var gain3 = audioCtx.createGain();
  gain3.gain.value = 0.15;
  
  crack.connect(filter3);
  filter3.connect(gain3);
  gain3.connect(masterGain);
  
  osc1.start(t);
  osc1.stop(t + 0.3);
  osc2.start(t);
  osc2.stop(t + 0.2);
  crack.start(t);
}

// 彩带音效 - 轻盈的沙沙声
function playConfettiSound() {
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  
  // 多层沙沙声
  for (var layer = 0; layer < 3; layer++) {
    var bufferSize = audioCtx.sampleRate * 1.2;
    var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    
    for (var i = 0; i < bufferSize; i++) {
      var env = Math.exp(-i / (bufferSize * 0.2)) * Math.sin(i / 1000 + layer);
      data[i] = (Math.random() * 2 - 1) * env * 0.3;
    }
    
    var source = audioCtx.createBufferSource();
    source.buffer = buffer;
    
    var filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 3000 + layer * 1500;
    filter.Q.value = 0.5;
    
    var gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.08, t + layer * 0.05);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 1.2);
    
    source.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    
    source.start(t + layer * 0.05);
  }
}

// 爱心音效 - 风铃般的叮铃声
function playHeartSound() {
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  
  // 和弦：523Hz (C5) + 659Hz (E5) + 784Hz (G5)
  var freqs = [523, 659, 784, 1047];
  
  freqs.forEach(function(freq, idx) {
    var osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    
    var gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.15, t + idx * 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
    
    // 添加颤音效果
    var vibrato = audioCtx.createOscillator();
    vibrato.frequency.value = 5;
    var vibratoGain = audioCtx.createGain();
    vibratoGain.gain.value = 3;
    vibrato.connect(vibratoGain);
    vibratoGain.connect(osc.frequency);
    vibrato.start(t);
    vibrato.stop(t + 1.5);
    
    osc.connect(gain);
    gain.connect(masterGain);
    
    osc.start(t + idx * 0.03);
    osc.stop(t + 1.5);
  });
}

// 显示音效提示
function showSoundHint() {
  var hint = document.getElementById('soundHint');
  hint.classList.add('show');
  setTimeout(function() { hint.classList.remove('show'); }, 1500);
}

// ========== 音效激活弹窗 ==========
document.getElementById('enableSound').addEventListener('click', function() {
  initAudio();
  document.getElementById('soundModal').classList.add('hidden');
  // 播放一个测试音效
  if (audioCtx) {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.frequency.value = 523;
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  }
});

// ========== 星星生成 ==========
(function(){
  var bg = document.getElementById('bgLayer');
  for (var i = 0; i < 35; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    s.style.left = (Math.random()*100)+'%';
    s.style.top = (Math.random()*38)+'%';
    s.style.animationDelay = (Math.random()*3)+'s';
    s.style.opacity = (0.3+Math.random()*0.6).toString();
    bg.appendChild(s);
  }
})();

// ========== 烟花系统（Canvas 逼真版）==========
var canvas = document.getElementById('fwCanvas');
var ctx = canvas.getContext('2d');
var W, H;
var rockets = [];
var particles = [];
var isRunning = false;

function resizeCanvas() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// --- 火箭类 ---
function Rocket(x, ty) {
  this.x = x;
  this.y = H;
  this.ty = ty;
  this.speed = 7 + Math.random() * 3;
  this.trail = [];
  this.alive = true;
  this.hue = Math.random() * 360;
}

Rocket.prototype.update = function() {
  this.trail.push({ x: this.x, y: this.y });
  if (this.trail.length > 12) this.trail.shift();
  this.y -= this.speed;
  if (this.y <= this.ty) {
    this.alive = false;
    explode(this.x, this.y, this.hue);
  }
};

Rocket.prototype.draw = function() {
  // 尾迹
  for (var i = 0; i < this.trail.length; i++) {
    var t = this.trail[i];
    var a = i / this.trail.length;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 1.5 * a + 0.5, 0, Math.PI * 2);
    ctx.fillStyle = 'hsla(' + this.hue + ',100%,70%,' + (a * 0.6) + ')';
    ctx.fill();
  }
  // 头部
  ctx.beginPath();
  ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
  ctx.fillStyle = 'hsl(' + this.hue + ',100%,85%)';
  ctx.shadowBlur = 8;
  ctx.shadowColor = 'hsl(' + this.hue + ',100%,70%)';
  ctx.fill();
  ctx.shadowBlur = 0;
};

// --- 粒子类 ---
function Particle(x, y, hue, type) {
  this.x = x;
  this.y = y;
  this.hue = hue;
  this.type = type || 'sphere';

  var angle = Math.random() * Math.PI * 2;
  var speed = 1 + Math.random() * 6;

  this.vx = Math.cos(angle) * speed;
  this.vy = Math.sin(angle) * speed;
  this.gravity = 0.04;
  this.friction = 0.98;
  this.alpha = 1;
  this.decay = 0.008 + Math.random() * 0.015;
  this.trail = [];
  this.size = 1.5 + Math.random() * 1.5;

  if (this.type === 'willow') {
    this.decay = 0.004 + Math.random() * 0.008;
    this.gravity = 0.02;
  }
}

Particle.prototype.update = function() {
  this.trail.push({ x: this.x, y: this.y });
  if (this.trail.length > 6) this.trail.shift();

  this.vx *= this.friction;
  this.vy *= this.friction;
  this.vy += this.gravity;
  this.x += this.vx;
  this.y += this.vy;
  this.alpha -= this.decay;
};

Particle.prototype.draw = function() {
  for (var i = 0; i < this.trail.length; i++) {
    var t = this.trail[i];
    var a = (i / this.trail.length) * this.alpha * 0.5;
    ctx.beginPath();
    ctx.arc(t.x, t.y, this.size * 0.6, 0, Math.PI * 2);
    ctx.fillStyle = 'hsla(' + this.hue + ',100%,70%,' + a + ')';
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
  ctx.fillStyle = 'hsla(' + this.hue + ',100%,75%,' + this.alpha + ')';
  ctx.shadowBlur = 6;
  ctx.shadowColor = 'hsla(' + this.hue + ',100%,60%,' + this.alpha + ')';
  ctx.fill();
  ctx.shadowBlur = 0;
};

// --- 爆炸函数 ---
function explode(x, y, baseHue) {
  // 播放爆炸音效
  playExplosionSound();
  
  var count = 60 + Math.floor(Math.random() * 40);
  var types = ['sphere','chrys','willow','palm'];
  var type = types[Math.floor(Math.random() * types.length)];

  for (var i = 0; i < count; i++) {
    var hue = baseHue + (Math.random() - 0.5) * 60;
    if (hue < 0) hue += 360;
    if (hue > 360) hue -= 360;
    particles.push(new Particle(x, y, hue, type));
  }

  // 二次爆炸
  if (Math.random() > 0.5) {
    setTimeout(function(px, py) {
      for (var j = 0; j < 20; j++) {
        particles.push(new Particle(px, py, 40 + Math.random() * 20, 'sphere'));
      }
    }, 150, x, y);
  }
}

// --- 发射火箭 ---
function launchRocket() {
  var x = 50 + Math.random() * (W - 100);
  var ty = 30 + Math.random() * (H * 0.35);
  rockets.push(new Rocket(x, ty));
}

// --- 主循环 ---
function loop() {
  if (!isRunning && rockets.length === 0 && particles.length === 0) return;

  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  rockets = rockets.filter(function(r) {
    r.update();
    r.draw();
    return r.alive;
  });

  particles = particles.filter(function(p) {
    p.update();
    p.draw();
    return p.alpha > 0.02;
  });

  window.requestAnimationFrame(loop);
}

function startLoop() {
  if (!isRunning) {
    isRunning = true;
    ctx.clearRect(0, 0, W, H);
    window.requestAnimationFrame(loop);
  }
}

function stopFireworks() {
  isRunning = false;
  rockets = [];
  particles = [];
  ctx.clearRect(0, 0, W, H);
}

// ========== 彩带 ==========
function throwCF() {
  // 播放彩带音效
  playConfettiSound();
  
  var layer = document.getElementById('fxLayer');
  var cols = ['#FFD700','#FFA500','#FF6347','#FF69B4','#00BFFF','#FFF','#FF4500','#FF1493','#7B68EE','#00FA9A'];
  for (var i = 0; i < 45; i++) {
    var d = document.createElement('div');
    d.className = 'cf-piece';
    var w = 7 + Math.random() * 12;
    var h = 10 + Math.random() * 18;
    d.style.cssText =
      'left:' + (Math.random()*100) + '%;' +
      'top:-20px;' +
      'width:' + w + 'px;' +
      'height:' + h + 'px;' +
      'background:' + cols[Math.floor(Math.random()*cols.length)] + ';' +
      'border-radius:' + (Math.random()>0.5?'50%':'2px') + ';' +
      'opacity:1;' +
      'animation:cfFall ' + (2.5+Math.random()*3) + 's linear ' + (Math.random()*2) + 's forwards;' +
      'pointer-events:none;';
    layer.appendChild(d);
    (function(el) {
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 7000);
    })(d);
  }
}

// ========== 爱心 ==========
function sendHT() {
  // 播放爱心音效
  playHeartSound();
  
  var layer = document.getElementById('fxLayer');
  var emos = ['💖','💗','💘','💝','❤️','🧡','💛','💚','💙','💜','🤎','🖤','🤍'];
  for (var i = 0; i < 14; i++) {
    var h = document.createElement('div');
    h.className = 'ht-piece';
    h.textContent = emos[Math.floor(Math.random()*emos.length)];
    h.style.cssText =
      'left:' + (5+Math.random()*90) + '%;' +
      'bottom:' + (5+Math.random()*25) + '%;' +
      'font-size:' + (24+Math.random()*32) + 'px;' +
      'animation-delay:' + (i*0.15) + 's;';
    layer.appendChild(h);
    (function(el) {
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 4500);
    })(h);
  }
}

// ========== 气球 ==========
function addBL() {
  var layer = document.getElementById('fxLayer');
  var b = document.createElement('div');
  b.className = 'bl-item';
  b.style.cssText = 'left:' + (5+Math.random()*90) + '%;font-size:' + (40+Math.random()*45) + 'px;';
  b.textContent = ['🎈','🎈','🎈','🎊'][Math.floor(Math.random()*4)];
  layer.appendChild(b);
  setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 15000);
}

// ========== 背景音乐 ==========
var bgMusic = null;
var bgMusicPlaying = false;

function initBgMusic() {
  if (!bgMusic) {
    // 尝试多个可能的路径
    var paths = ['bg-music.mp3', './bg-music.mp3', '/liuyi/bg-music.mp3'];
    var idx = 0;
    
    function tryLoad() {
      if (idx >= paths.length) {
        console.error('所有路径都无法加载音乐');
        return;
      }
      bgMusic = new Audio(paths[idx]);
      bgMusic.loop = true;
      bgMusic.volume = 0.5;
      bgMusic.load();
      
      bgMusic.onerror = function() {
        console.log('路径失败: ' + paths[idx]);
        idx++;
        tryLoad();
      };
    }
    
    tryLoad();
  }
}

function toggleBgMusic() {
  initAudio();
  if (!bgMusic) initBgMusic();
  
  if (bgMusicPlaying) {
    bgMusic.pause();
    bgMusicPlaying = false;
    document.getElementById('btnBgMusic').classList.remove('on');
  } else {
    bgMusic.play().then(function() {
      bgMusicPlaying = true;
      document.getElementById('btnBgMusic').classList.add('on');
    }).catch(function() {
      console.log('播放失败，请先点击音效激活按钮');
    });
  }
}

// ========== 模式切换 ==========
var curMode = null;
var timers = {};

function go(mode) {
  // 初始化音频（需要用户交互）
  initAudio();
  showSoundHint();
  
  if (curMode === mode) { stopAll(); return; }
  stopAll();

  curMode = mode;
  document.getElementById('btnFw').classList.remove('on');
  document.getElementById('btnCf').classList.remove('on');
  document.getElementById('btnHt').classList.remove('on');

  if (mode === 'fw') document.getElementById('btnFw').classList.add('on');
  if (mode === 'cf') document.getElementById('btnCf').classList.add('on');
  if (mode === 'ht') document.getElementById('btnHt').classList.add('on');

  // 气球
  timers.bl = setInterval(addBL, 2200);
  addBL();

  if (mode === 'fw') {
    startLoop();
    launchRocket();
    timers.fw = setInterval(launchRocket, 700);
  } else if (mode === 'cf') {
    throwCF();
    timers.cf = setInterval(throwCF, 2400);
  } else if (mode === 'ht') {
    sendHT();
    timers.ht = setInterval(sendHT, 2600);
  }
}

function stopAll() {
  Object.keys(timers).forEach(function(k) { clearInterval(timers[k]); });
  timers = {};
  stopFireworks();
  document.getElementById('fxLayer').innerHTML = '';
  document.getElementById('btnFw').classList.remove('on');
  document.getElementById('btnCf').classList.remove('on');
  document.getElementById('btnHt').classList.remove('on');
  curMode = null;
}

// 按钮绑定
document.getElementById('btnFw').addEventListener('click', function(){ go('fw'); });
document.getElementById('btnCf').addEventListener('click', function(){ go('cf'); });
document.getElementById('btnHt').addEventListener('click', function(){ go('ht'); });
document.getElementById('btnBgMusic').addEventListener('click', toggleBgMusic);
</script>
